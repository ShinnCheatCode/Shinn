name: Build 3105

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build
        run: |
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build \
            2>&1 | tee xcodebuild.log

      - name: Show errors
        if: failure()
        run: grep -n -B5 -A5 "error:" xcodebuild.log || true

      - name: Package IPA
        if: success()
        run: |
          mkdir -p artifact/Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app artifact/Payload/
          cd artifact && zip -qry ../3105-unsigned.ipa Payload

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa