name: "3105"

options:
  bundleIdPrefix: com.apple.mobile
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""

targets:
  "3105":
    type: application
    platform: iOS

    sources:
      - path: ThreeOneOSFive
        excludes:
          - "Info.plist"
          - "en.Iproj/**"
          - "zh-Hans.Iproj/**"
          - "*.entitlements"

    info:
      path: ThreeOneOSFive/Info.plist
      properties:
        CFBundleDisplayName: "Shinn Cheat"
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.apple.mobile.MobileHouseArrest"
        INFOPLIST_FILE: "ThreeOneOSFive/Info.plist"

        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"

        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

        ENABLE_BITCODE: "NO"
        CLANG_ENABLE_MODULES: "YES"
        CLANG_ENABLE_OBJC_ARC: "YES"

        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h"

        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThreeOneOSFive"
          - "$(SRCROOT)/ThreeOneOSFive/exploit"
          - "$(SRCROOT)/ThreeOneOSFive/kexploit"
          - "$(SRCROOT)/ThreeOneOSFive/helpers"

        OTHER_LDFLAGS:
          - "-lz"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "Security"

    scheme:
      testTargets: []